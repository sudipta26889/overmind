# Production stack: a Git-backed Portainer stack on the NAS Portainer (endpoint 11 = NUC).
# CI builds the images after main passes and fires the stack webhook.
# docker-compose.yml stays for development on the Mac.
#
# Portainer Git stacks cannot read an env_file, so every key in .env is listed below as
# ${KEY:-} and its value lives in the stack Env. A new env key goes in .env, .env.example,
# here, AND the stack Env. Queues and concurrency must match docker-compose.yml.

x-env: &env
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
  AWS_BUCKET_NAME: ${AWS_BUCKET_NAME:-}
  AWS_ENDPOINT_URL_S3: ${AWS_ENDPOINT_URL_S3:-}
  AWS_REGION: ${AWS_REGION:-}
  AWS_S3_CUSTOM_DOMAIN: ${AWS_S3_CUSTOM_DOMAIN:-}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
  BASETEN_API_KEY: ${BASETEN_API_KEY:-}
  BASETEN_PROJECT: ${BASETEN_PROJECT:-}
  CACHE_URL: ${CACHE_URL:-}
  CELERY_BROKER_URL: ${CELERY_BROKER_URL:-}
  CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-}
  CLERK_API_SECRET_KEY: ${CLERK_API_SECRET_KEY:-}
  CLERK_AUTHORIZED_PARTIES: ${CLERK_AUTHORIZED_PARTIES:-}
  DJANGO_ADMIN_PATH: ${DJANGO_ADMIN_PATH:-}
  DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-}
  DJANGO_CORS_ALLOWED_ORIGINS: ${DJANGO_CORS_ALLOWED_ORIGINS:-}
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-}
  FIELD_ENCRYPTION_KEY: ${FIELD_ENCRYPTION_KEY:-}
  FINETUNING_BACKEND: ${FINETUNING_BACKEND:-}
  FRONTEND_URL: ${FRONTEND_URL:-}
  GRAFANA_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-}
  HF_TOKEN: ${HF_TOKEN:-}
  INFERENCE_API_KEY: ${INFERENCE_API_KEY:-}
  INFERENCE_API_URL: ${INFERENCE_API_URL:-}
  JEV_MODEL: ${JEV_MODEL:-}
  JEV_REQUESTS_PER_MINUTE: ${JEV_REQUESTS_PER_MINUTE:-}
  JEV_TOKENS_PER_SECOND: ${JEV_TOKENS_PER_SECOND:-}
  LLM_AGENT_CHAIN: ${LLM_AGENT_CHAIN:-}
  LLM_EXPLAIN_CHAIN: ${LLM_EXPLAIN_CHAIN:-}
  LLM_FAST_CHAIN: ${LLM_FAST_CHAIN:-}
  MCP_SERVER_URL: ${MCP_SERVER_URL:-}
  MODAL_ENVIRONMENT: ${MODAL_ENVIRONMENT:-}
  MODAL_TOKEN_ID: ${MODAL_TOKEN_ID:-}
  MODAL_TOKEN_SECRET: ${MODAL_TOKEN_SECRET:-}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  OPENAI_APPS_CHALLENGE: ${OPENAI_APPS_CHALLENGE:-}
  OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
  OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-}
  POSTGRES_DB: ${POSTGRES_DB:-}
  POSTGRES_HOST: ${POSTGRES_HOST:-}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
  POSTGRES_PORT: ${POSTGRES_PORT:-}
  POSTGRES_USER: ${POSTGRES_USER:-}
  POSTHOG_HOST: ${POSTHOG_HOST:-}
  POSTHOG_PROJECT_TOKEN: ${POSTHOG_PROJECT_TOKEN:-}
  SANDBOX_TOKEN: ${SANDBOX_TOKEN:-}
  STRIPE_CREDIT_PRICE_ID: ${STRIPE_CREDIT_PRICE_ID:-}
  STRIPE_PRO_PRICE_ID: ${STRIPE_PRO_PRICE_ID:-}
  STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
  STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
  TOGETHER_API_KEY: ${TOGETHER_API_KEY:-}
  TRACE_SCORING_SAMPLE_RATE: ${TRACE_SCORING_SAMPLE_RATE:-}
  WORKSHOP_PROJECT_CONCURRENCY: ${WORKSHOP_PROJECT_CONCURRENCY:-}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  DJANGO_SETTINGS_MODULE: overbae.settings
  DJANGO_DEBUG: "False"
  SANDBOX_URL: http://sandbox:8080
  DATA_ROOT: /data
  MEDIA_ROOT: /data/media
  TMPDIR: /data/tmp
  HOME: /data/tmp
  AWS_PROFILE: default
  AWS_CONFIG_FILE: /code/.aws-minio/config
  AWS_SHARED_CREDENTIALS_FILE: /data/tmp/.aws/credentials

x-app: &app
  image: ghcr.io/sudipta26889/overmind-api:latest
  restart: always
  environment: *env
  volumes:
    - app_data:/data

x-worker: &worker
  <<: *app
  # Runs without the migration step; only the api migrates.
  entrypoint: ["/usr/local/bin/worker-entrypoint.sh"]
  depends_on: &needs-api
    api:
      condition: service_healthy

x-sandboxed-worker: &sandboxed-worker
  <<: *worker
  networks: [default, sandbox_net]
  depends_on:
    <<: *needs-api
    sandbox:
      condition: service_healthy

services:
  api:
    <<: *app
    command: sh -c "python manage.py collectstatic --noinput && uvicorn overbae.asgi:application --host 0.0.0.0 --port 8000 --timeout-graceful-shutdown 5"
    ports:
      - "5980:8000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)\"",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 120s

  console:
    image: ghcr.io/sudipta26889/overmind-console:latest
    restart: always
    ports:
      - "5973:80"

  celery-control-worker:
    <<: *worker
    command: celery -A overbae worker -l info --pool=threads --concurrency=8 -Q control

  celery-io-worker:
    <<: *worker
    command: celery -A overbae worker -l info --pool=threads --concurrency=24 --prefetch-multiplier=1 --disable-prefetch --hostname=io@%h -Q io

  # Memory caps + init: these workers leaked to 8-9 GiB each and filled host swap.
  celery-traces-worker:
    <<: *worker
    command: celery -A overbae worker -l info --pool=prefork --concurrency=4 --prefetch-multiplier=1 --disable-prefetch --hostname=io_traces@%h -Q io_traces
    mem_limit: 4g
    memswap_limit: 5g
    init: true

  celery-batch-worker:
    <<: *worker
    command: celery -A overbae worker -l info --pool=prefork --concurrency=6 --prefetch-multiplier=1 --disable-prefetch -Q batch
    mem_limit: 5g
    memswap_limit: 6g
    init: true

  celery-landing-worker:
    <<: *sandboxed-worker
    command: celery -A overbae worker -l info --pool=prefork --concurrency=1 --prefetch-multiplier=1 --disable-prefetch --hostname=landing@%h -Q landing
    mem_limit: 4g
    memswap_limit: 5g
    init: true

  celery-interactive-worker:
    <<: *sandboxed-worker
    command: celery -A overbae worker -l info --pool=prefork --concurrency=4 --prefetch-multiplier=1 --disable-prefetch --hostname=interactive@%h -Q interactive
    mem_limit: 4g
    memswap_limit: 5g
    init: true

  celery-beat:
    <<: *worker
    command: celery -A overbae beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler

  # Runs packages and document parsing without network egress, app secrets or media mounts.
  sandbox:
    image: ghcr.io/sudipta26889/overmind-api:latest
    entrypoint: ["/usr/local/bin/worker-entrypoint.sh"]
    command: python -m sandbox
    init: true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - KILL
      - SETGID
      - SETUID
      - SYS_PTRACE
    security_opt:
      - no-new-privileges:true
    restart: always
    environment:
      SANDBOX_TOKEN: ${SANDBOX_TOKEN:-}
      SANDBOX_MEMORY_BYTES: ${SANDBOX_MEMORY_BYTES:-0}
      SANDBOX_OCR_WORKERS: ${SANDBOX_OCR_WORKERS:-2}
    tmpfs:
      - /tmp:size=8g
    networks:
      - sandbox_net
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2)\"",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  # The volume the running deployment already uses; external so a stack removal cannot delete it.
  app_data:
    external: true
    name: overclaw_app_data

networks:
  sandbox_net:
